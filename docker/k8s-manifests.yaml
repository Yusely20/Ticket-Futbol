apiVersion: v1
kind: Namespace
metadata:
  name: ticket-futbol

---
# Shared storage for QR codes
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qrcodes-pvc
  namespace: ticket-futbol
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi

---
# Database layer: PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: ticket-futbol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-db
          ports:
            - containerPort: 5432
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: ticket-futbol
spec:
  ports:
    - port: 5432
  selector:
    app: db

---
# Cache & Message Broker: Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ticket-futbol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ticket-futbol
spec:
  ports:
    - port: 6379
  selector:
    app: redis

---
# Simulated AWS Lambdas: lambda-runner
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lambda-runner
  namespace: ticket-futbol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lambda-runner
  template:
    metadata:
      labels:
        app: lambda-runner
    spec:
      containers:
        - name: lambda-runner
          image: ticket_lambda_runner:latest # Built from local dockerfile
          imagePullPolicy: IfNotPresent
          env:
            - name: LAMBDA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: lambda-api-key
          ports:
            - containerPort: 8001
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: qrcodes-storage
              mountPath: /app/static/qrcodes
      volumes:
        - name: qrcodes-storage
          persistentVolumeClaim:
            claimName: qrcodes-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: lambda-runner
  namespace: ticket-futbol
spec:
  ports:
    - port: 8001
  selector:
    app: lambda-runner

---
# Core API Gateway: api (N+1 replicas & probes)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ticket-futbol
spec:
  replicas: 3 # Scale Out & N+1 Design (3 replicas in parallel)
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ticket_api_gateway:latest # Built from local dockerfile
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-password
            - name: POSTGRES_HOST
              value: "db"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-db
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/0"
            - name: LAMBDA_SERVICE_URL
              value: "http://lambda-runner:8001"
            - name: LAMBDA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: lambda-api-key
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe: # Design to be Monitored & Resilient
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: qrcodes-storage
              mountPath: /app/static/qrcodes
      volumes:
        - name: qrcodes-storage
          persistentVolumeClaim:
            claimName: qrcodes-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ticket-futbol
spec:
  type: LoadBalancer # Rancher Desktop internal load balancer
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: api

---
# Queue Worker: celery-worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: ticket-futbol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ticket_celery_worker:latest # Built from local dockerfile
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-password
            - name: POSTGRES_HOST
              value: "db"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: postgres-db
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis:6379/0"
            - name: LAMBDA_SERVICE_URL
              value: "http://lambda-runner:8001"
            - name: LAMBDA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ticket-futbol-secrets
                  key: lambda-api-key
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: qrcodes-storage
              mountPath: /app/static/qrcodes
      volumes:
        - name: qrcodes-storage
          persistentVolumeClaim:
            claimName: qrcodes-pvc

---
# Celery Monitoring Dashboard: celery-flower
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-flower
  namespace: ticket-futbol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-flower
  template:
    metadata:
      labels:
        app: celery-flower
    spec:
      containers:
        - name: celery-flower
          image: mher/flower:latest
          env:
            - name: CELERY_BROKER_URL
              value: "redis://redis:6379/0"
          ports:
            - containerPort: 5555
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: celery-flower
  namespace: ticket-futbol
spec:
  type: LoadBalancer
  ports:
    - port: 5555
      targetPort: 5555
  selector:
    app: celery-flower
